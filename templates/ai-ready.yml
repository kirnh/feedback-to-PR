name: AI ready for approval
on:
  issues:
    types: [labeled]

jobs:
  ask:
    if: github.event.label.name == 'ai-triaged'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Posted by the Actions bot, so GitHub notifies the owner (it would not notify them about their own actions).
      - name: Ask the owner
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "@$OWNER new feedback is ready. To have the AI draft a fix, add the label \`ai-fix\`. To reject it, close this issue."
