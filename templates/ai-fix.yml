name: AI fix
on:
  issues:
    types: [labeled]

jobs:
  fix:
    if: github.event.label.name == 'ai-fix'
    # Change OWNER to the account that holds agent-harness.
    uses: OWNER/agent-harness/.github/workflows/fix-issue.yml@v1
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}   # only if agent-harness is private
