name: AI fix
run-name: AI fix #${{ github.event.issue.number }}
on:
  issues:
    types: [labeled]

jobs:
  fix:
    if: github.event.label.name == 'ai-fix'
    # Change OWNER to the account that holds feedback-to-PR.
    uses: OWNER/feedback-to-PR/.github/workflows/fix-issue.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      # Pass the key(s) for the runner/model set in harness.config.yml.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Optional phone notifications (ntfy): "needs you" and low-priority progress topics.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_PROGRESS_TOPIC: ${{ secrets.NTFY_PROGRESS_TOPIC }}
      # HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}   # only if feedback-to-PR is private
