name = "feedback-to-pr"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Keep and search Worker logs in the Cloudflare dashboard (Workers & Pages > feedback-to-pr > Observability).
# Logs record GitHub status codes and messages only, never tokens or link contents.
[observability]
enabled = true

# Static files (the push test page, its service worker, manifest and icons) served from ./public.
# Requests that match no file fall through to the Worker code.
[assets]
directory = "./public"

[vars]
# Comma-separated owner/repo list this Worker may act on.
ALLOWED_REPOS = "kirnh/MediSync"

# Apps that can receive feedback: project id -> repo and display name (feedback is filed as issues there).
PROJECTS = '{"medisync":{"repo":"kirnh/MediSync","name":"MediSync"}}'

# Which model rewrites feedback into issues. Any provider: "anthropic" (default) or "openai-compatible" (+ TRIAGE_BASE_URL).
TRIAGE_PROVIDER = "anthropic"
TRIAGE_MODEL = "claude-haiku-5-5"

# Single-use record for approval links, and scratch space for the push test.
# Create with: npx wrangler kv namespace create USED, then paste the printed id below.
[[kv_namespaces]]
binding = "USED"
id = "781b6074f62f481a901c1b9e2ed46c91"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   SIGNING_KEY          shared HMAC key; also stored as the APPROVAL_SIGNING_KEY secret in the app repo
#   GITHUB_TOKEN         fine-grained token, Issues read/write on the allowed repos
#   NTFY_PROGRESS_TOPIC  ntfy topic for acknowledgements (optional)
#   TRIAGE_LLM_KEY       API key for the triage model
#   VAPID_PRIVATE_JWK    web push signing key (push test only)
# Do not set these by hand. Every key is kept in GitHub secrets and copied here by the deploy-worker workflow:
#   node scripts/secrets.mjs list     (what exists, where, and what each is for)
#   node scripts/secrets.mjs set <ID>
