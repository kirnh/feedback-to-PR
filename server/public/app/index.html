<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Change Inbox</title>
<meta name="theme-color" content="#0e1514">
<style>
/* Layout: one phone-width column. Sticky header with spend and stage chips, then one card per change.
   Stripe and pill carry the stage so the list can be scanned without reading. Read-only: every action opens GitHub. */
:root{
  --bg:#f3f5f3;--surface:#fff;--fg:#14201f;--muted:#5a6967;--line:#d6dddb;--accent:#14201f;--on-accent:#fff;
  --need:#a15c07;--need-bg:#fdf0dc;--run:#1d5fa8;--run-bg:#e3eefb;--review:#6b46b8;--review-bg:#eee8fb;
  --fail:#b3261e;--fail-bg:#fbe7e5;--ok:#17704a;--ok-bg:#e0f3e8;--mute:#6b7775;--mute-bg:#eceeed;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1514;--surface:#162120;--fg:#e8efed;--muted:#9bacaa;--line:#2a3937;--accent:#e8efed;--on-accent:#0e1514;
  --need:#f0b062;--need-bg:#2d2113;--run:#7db6f2;--run-bg:#12253a;--review:#b9a2f0;--review-bg:#221a3a;
  --fail:#f19a94;--fail-bg:#3a1917;--ok:#6fd3a0;--ok-bg:#10291e;--mute:#9bacaa;--mute-bg:#1d2a29;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:0 max(16px,env(safe-area-inset-right)) max(56px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.col{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}h1{font-size:22px;letter-spacing:-.01em}h2{font-size:15px}h3{font-size:16.5px;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.mono{font:12px ui-monospace,Menlo,monospace}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 0 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sub{font:11.5px ui-monospace,Menlo,monospace;color:var(--muted)}
.icon{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center}
.stats{display:flex;gap:6px 16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}.stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.chip .n{font:12px ui-monospace,Menlo,monospace;padding:1px 7px;border-radius:99px;background:var(--mute-bg);color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.chip[aria-pressed="true"] .n{background:rgba(127,127,127,.3);color:inherit}
.chip.attn:not([aria-pressed="true"]) .n{background:var(--need-bg);color:var(--need)}
.problems{display:flex;flex-direction:column;gap:8px}
.problem{border:1px solid var(--fail);background:var(--fail-bg);border-radius:8px;padding:10px 12px;font-size:13.5px}.problem.warn{border-color:var(--need);background:var(--need-bg)}
.problem b{color:var(--fail)}.problem.warn b{color:var(--need)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--stripe,var(--line));border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.need{--stripe:var(--need)}.card.run{--stripe:var(--run)}.card.review{--stripe:var(--review)}.card.fail{--stripe:var(--fail)}.card.done{--stripe:var(--ok)}.card.rejected{--stripe:var(--mute)}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:10.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--mute-bg);color:var(--mute)}
.pill.need{background:var(--need-bg);color:var(--need)}.pill.run{background:var(--run-bg);color:var(--run)}.pill.review{background:var(--review-bg);color:var(--review)}.pill.fail{background:var(--fail-bg);color:var(--fail)}.pill.done{background:var(--ok-bg);color:var(--ok)}
.age{margin-left:auto;font-size:12px;color:var(--muted)}.repo{font-size:12px;color:var(--muted)}
.num{font:12.5px ui-monospace,Menlo,monospace;color:var(--muted);font-weight:400;margin-right:6px}
.sum{color:var(--muted);font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);flex:1 1 120px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
details{border-top:1px solid var(--line);padding-top:6px}summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-size:13.5px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}summary::after{content:"+";margin-left:auto;font:14px ui-monospace,Menlo,monospace;color:var(--muted)}details[open] summary::after{content:"\2013"}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
.tbl th{font:10.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}.p{color:var(--ok)}.f{color:var(--fail)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:6px 0 0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lock{min-height:80vh;display:grid;place-items:center}.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.lockbox label{font-size:13px;color:var(--muted)}
.lockbox input{width:100%;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.err{color:var(--fail);font-size:13.5px;min-height:20px}.fine{font-size:12.5px;color:var(--muted)}
.loading{opacity:.6}
</style>
</head>
<body>
<div class="col" id="app"><p class="fine" style="padding-top:40px">Loading…</p></div>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var STAGES = [["need", "Needs you"], ["run", "Running"], ["review", "To review"], ["fail", "Failed"], ["done", "Shipped"], ["rejected", "Rejected"]];
  var view = "loading", data = null, filter = null, loading = false, loginError = "", fetchError = "";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function href(u) { return typeof u === "string" && u.indexOf("https://github.com/") === 0 ? esc(u) : "#"; }
  function ago(iso) {
    var s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (isNaN(s)) return "";
    if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago";
  }
  function money(n) { return "$" + (Math.round(n * 100) / 100).toFixed(2); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function load(fresh) {
    if (loading) return; loading = true; fetchError = ""; render();
    fetch("/v1/dashboard" + (fresh ? "?fresh=1" : ""), { credentials: "same-origin" })
      .then(function (r) {
        if (r.status === 401) { view = "login"; data = null; return null; }
        return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || ("Error " + r.status)); return j; });
      })
      .then(function (j) {
        if (j) {
          data = j; view = "inbox";
          var wanted = store("filter");
          var counts = j.totals.counts;
          filter = (wanted && counts[wanted] !== undefined && (counts[wanted] > 0 || wanted === "need")) ? wanted
            : ["need", "run", "review", "fail"].filter(function (k) { return counts[k] > 0; })[0] || "need";
        }
      })
      .catch(function (e) { fetchError = e.message || "Could not load."; if (view === "loading") view = "inbox"; })
      .then(function () { loading = false; render(); });
  }

  function trace(i) {
    var t = i.trace; if (!t) return "";
    var h = "<details><summary>Trace</summary>";
    if (t.checks && t.checks.length) {
      h += '<table class="tbl"><thead><tr><th>Check</th><th>Before</th><th>After</th></tr></thead><tbody>' + t.checks.map(function (c) {
        return "<tr><td>" + esc(c.name) + '</td><td class="' + (c.beforePass === null ? "" : c.beforePass ? "p" : "f") + '">' + (c.beforePass === null ? "n/a" : c.beforePass ? "pass" : "fail") + '</td><td class="' + (c.afterPass === null ? "" : c.afterPass ? "p" : "f") + '">' + (c.afterPass === null ? "n/a" : c.afterPass ? "pass" : "fail") + "</td></tr>";
      }).join("") + "</tbody></table>";
      h += '<p class="fine" style="margin-top:6px">' + (t.introduced && t.introduced.length ? "This change broke: " + esc(t.introduced.join(", ")) + "." : "No new failures. Anything failing in both columns already fails on the base branch.") + "</p>";
    }
    h += '<dl class="kv">';
    if (t.approver) h += "<dt>Approved by</dt><dd>" + esc(t.approver) + "</dd>";
    if (t.model) h += "<dt>Model</dt><dd>" + esc(t.model) + "</dd>";
    if (t.cost !== undefined) h += "<dt>Cost</dt><dd>" + money(t.cost) + (t.turns ? " · " + t.turns + " turns" : "") + "</dd>";
    if (t.files !== undefined) h += "<dt>Files changed</dt><dd>" + t.files + "</dd>";
    return h + "</dl></details>";
  }

  function card(i) {
    var h = '<article class="card ' + esc(i.stage) + '"><div class="head"><span class="pill ' + esc(i.stage) + '">' + esc(i.stageLabel) + '</span><span class="repo">' + esc(i.repo) + '</span><span class="age">' + esc(ago(i.at)) + "</span></div>";
    h += '<h3><span class="num">#' + i.issue + "</span>" + esc(i.title) + '</h3><p class="sum">' + esc(i.detail) + "</p>";
    if (i.trace && (i.trace.model || i.trace.cost !== undefined)) h += '<div class="meta">' + (i.trace.model ? "<span>" + esc(i.trace.model) + "</span>" : "") + (i.trace.cost !== undefined ? "<span>" + money(i.trace.cost) + (i.trace.turns ? " · " + i.trace.turns + " turns" : "") + "</span>" : "") + "</div>";
    h += '<div class="actions">';
    if (i.pr) h += '<a class="btn primary" href="' + href(i.pr.url) + '" target="_blank" rel="noopener">Open PR #' + i.pr.number + "</a>";
    if (i.run) h += '<a class="btn" href="' + href(i.run.url) + '" target="_blank" rel="noopener">View run</a>';
    h += '<a class="btn' + (i.stage === "need" ? " primary" : "") + '" href="' + href(i.url) + '" target="_blank" rel="noopener">Open issue</a></div>';
    if (i.stage === "need") h += '<p class="fine">Approve or reject from the phone notification, or open the issue and add the <span class="mono">ai-fix</span> label.</p>';
    return h + trace(i) + "</article>";
  }

  function inbox() {
    var d = data, h = "";
    var counts = d ? d.totals.counts : {};
    h += '<header class="top"><div class="row"><div><h1>Change inbox</h1><div class="sub">' + (d ? esc(d.repos.join(", ")) + " · updated " + esc(ago(d.generatedAt)) : "") + "</div></div>" +
      '<button class="icon" id="refresh" aria-label="Refresh"' + (loading ? " disabled" : "") + '><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button></div>';
    if (d) {
      h += '<div class="stats"><span>Spent, ' + d.totals.windowDays + " days <b>" + money(d.totals.spentUsd) + "</b></span><span>Running <b>" + (counts.run || 0) + "</b></span><span>Waiting on you <b>" + (counts.need || 0) + "</b></span></div>";
      h += '<div class="chips" role="group" aria-label="Filter by stage">' + STAGES.map(function (s) {
        return '<button class="chip' + (s[0] === "need" && counts.need ? " attn" : "") + '" data-stage="' + s[0] + '" aria-pressed="' + (filter === s[0]) + '">' + s[1] + ' <span class="n">' + (counts[s[0]] || 0) + "</span></button>";
      }).join("") + "</div>";
    }
    h += "</header>";
    if (fetchError) h += '<div class="problems"><div class="problem"><b>Could not refresh.</b> ' + esc(fetchError) + "</div></div>";
    if (d && d.problems.length) h += '<div class="problems" role="alert">' + d.problems.map(function (p) { return '<div class="problem' + (p.level === "warn" ? " warn" : "") + '"><b>' + (p.level === "warn" ? "Heads up." : "Problem.") + "</b> " + esc(p.text) + "</div>"; }).join("") + "</div>";
    if (d) {
      var items = d.items.filter(function (i) { return i.stage === filter; });
      h += '<section class="list' + (loading ? " loading" : "") + '" aria-live="polite">' + (items.length ? items.map(card).join("") : '<div class="empty">' + (filter === "need" ? "Nothing waiting on you." : "Nothing here.") + "</div>") + "</section>";
      h += system(d);
    }
    return h;
  }

  function system(d) {
    var hl = d.health, tok = hl.githubTokenDaysLeft;
    var h = '<section class="panel"><h2>System</h2><dl class="kv">';
    h += "<dt>GitHub token</dt><dd>" + (tok === null ? "expiry unknown" : tok < 0 ? '<span class="f">expired</span>' : tok + " day" + (tok === 1 ? "" : "s") + " left") + "</dd>";
    var src = hl.sources || {};
    h += "<dt>GitHub access</dt><dd>" + [["issues", "Issues"], ["pulls", "Pull requests"], ["runs", "Actions"]].map(function (k) { return src[k[0]] === false ? '<span class="f">' + k[1] + " \u2717</span>" : k[1] + " \u2713"; }).join(" \u00B7 ") + "</dd>";
    h += "<dt>Progress messages</dt><dd>" + (hl.progressNotifications ? "on" : "off (topic not set)") + "</dd>";
    h += "<dt>Web push key</dt><dd>" + (hl.webPushKey ? "set" : "not set") + "</dd></dl>";
    if (d.activity.length) h += '<h2 style="margin-top:6px">Recent approvals</h2><dl class="kv">' + d.activity.map(function (a) { return "<dt>" + esc(ago(a.t)) + "</dt><dd>" + esc(a.action || "") + (a.issue ? " #" + a.issue : "") + (a.repo ? " in " + esc(a.repo) : "") + "</dd>"; }).join("") + "</dl>";
    return h + '<button class="btn" id="logout" style="margin-top:6px">Sign out</button></section>';
  }

  function lock() {
    return '<div class="lock"><form class="lockbox" id="lockform"><h1>Change inbox</h1><p class="fine">Private. Enter your passphrase to continue.</p>' +
      '<div><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password" autofocus></div><p class="err" id="lockerr" role="alert">' + esc(loginError) + '</p>' +
      '<button class="btn primary" type="submit">Open inbox</button></form></div>';
  }

  function render() {
    app.innerHTML = view === "login" ? lock() : view === "loading" ? '<p class="fine" style="padding-top:40px">Loading…</p>' : inbox();
  }

  app.addEventListener("click", function (e) {
    var chip = e.target.closest("[data-stage]");
    if (chip) { filter = chip.getAttribute("data-stage"); store("filter", filter); render(); return; }
    if (e.target.closest("#refresh")) { load(true); return; }
    if (e.target.closest("#logout")) { fetch("/v1/session/logout", { method: "POST", credentials: "same-origin" }).then(function () { data = null; view = "login"; render(); }); }
  });
  app.addEventListener("submit", function (e) {
    if (e.target.id !== "lockform") return; e.preventDefault();
    var pw = document.getElementById("pw").value; loginError = "";
    fetch("/v1/session", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ passphrase: pw }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || "Could not sign in."); }); })
      .then(function () { view = "loading"; render(); load(true); })
      .catch(function (err) { loginError = err.message; render(); });
  });

  // Keep it fresh while the page is visible, and refresh when it comes back to the foreground.
  setInterval(function () { if (view === "inbox" && !document.hidden) load(false); }, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && view === "inbox") load(false); });
  load(false);
})();
</script>
</body>
</html>
