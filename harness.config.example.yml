# Copy to the root of a consumer repo as harness.config.yml and edit.
project: MyApp
platform: react-native   # react-native | web | other

commands:
  install: yarn install --frozen-lockfile
  lint:    yarn lint
  types:   yarn tsc --noEmit
  test:    yarn test --ci

# Areas of the codebase. The triage step uses these to label issues.
areas:
  - example-area

# Files an AI branch (ai/*) may never change. Glob patterns.
protected_paths:
  - ios/**/*.pbxproj
  - android/app/build.gradle
  - android/**/*.keystore
  - app.json

agent:
  max_turns: 25        # hard cap on agent steps per issue
  draft_pr: true

# Issue types that skip the manual ai-fix label (phase 3). Keep empty at first.
auto_approve:
  types: []

# Read by the agent before it starts.
instructions: CLAUDE.md

# Phase 2: who may send feedback.
intake:
  audience: beta-only
