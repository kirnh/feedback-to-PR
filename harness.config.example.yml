# Copy to the root of a consumer repo as harness.config.yml and edit.
project: MyApp

commands:
  install: yarn install --frozen-lockfile
  lint:    yarn lint
  types:   yarn tsc --noEmit
  test:    yarn test --ci

# Files an AI branch (ai/*) may never change. Glob patterns.
protected_paths:
  - ios/**/*.pbxproj
  - android/app/build.gradle
  - android/**/*.keystore
  - app.json

node_version: 22

agent:
  # Which engine edits the code. The harness handles branch, checks and PR for all of them.
  #   claude-code : Anthropic's agent. model e.g. claude-sonnet-5-5 (needs ANTHROPIC_API_KEY)
  #   aider       : any provider via LiteLLM model strings (untested, see README)
  #                 e.g. openrouter/deepseek/deepseek-chat, gpt-4o, gemini/gemini-2.0-flash
  runner: claude-code
  model: ""            # empty = runner default (claude-code defaults to claude-sonnet-5-5)
  max_turns: 25        # cap on agent steps (claude-code)

# Read by the agent before it starts.
instructions: CLAUDE.md
